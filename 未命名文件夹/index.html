<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>智能健身推荐系统</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --primary:#FF6B35;--secondary:#4ECDC4;--accent:#FF6B6B;
      --bg:#0F0F1A;--bg-card:#1A1A2E;--bg-card-hover:#222240;
      --bg-input:#16213E;--text:#E8E8E8;--text-muted:#A0A0B8;--border:#2A2A4A;
      --gradient-1:linear-gradient(135deg,#FF6B35,#FF8C42);
      --gradient-2:linear-gradient(135deg,#4ECDC4,#44B09E);
      --gradient-3:linear-gradient(135deg,#FF6B6B,#FF8E8E);
      --radius:12px;--radius-sm:8px;--danger:#E74C3C
    }
    body{
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
      background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6
    }
    .app{max-width:800px;margin:0 auto;padding:0 16px 40px}
    .app-header{padding:28px 0 16px;text-align:center}
    .app-header h1{font-size:28px;background:var(--gradient-1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
    .subtitle{color:var(--text-muted);font-size:14px;letter-spacing:2px}
    .tab-nav{display:flex;gap:6px;padding:4px;background:var(--bg-card);border-radius:var(--radius);margin-bottom:20px;overflow-x:auto}
    .tab-btn{flex:1;min-width:70px;padding:10px 12px;border:none;background:transparent;color:var(--text-muted);border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;transition:all .2s}
    .tab-btn:hover{color:var(--text);background:rgba(255,107,53,.1)}
    .tab-btn.active{background:var(--gradient-1);color:#fff;font-weight:600}
    .main-content{min-height:60vh}
    .section-title{font-size:22px;margin-bottom:16px}
    .today-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px}
    .today-badge{display:flex;align-items:center;gap:12px}
    .day-icon{font-size:40px}
    .today-badge h2{font-size:22px}
    .today-date{color:var(--text-muted);font-size:13px}
    .btn{padding:10px 20px;border:none;border-radius:var(--radius-sm);cursor:pointer;font-size:14px;font-weight:600;transition:all .2s}
    .btn-primary{background:var(--gradient-1);color:#fff}
    .btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(255,107,53,.3)}
    .btn-secondary{background:var(--bg-card);color:var(--text);border:1px solid var(--border)}
    .btn-secondary:hover{background:var(--bg-card-hover)}
    .btn-danger{background:var(--danger);color:#fff}
    .btn-danger:hover{opacity:.9}
    .btn-sm{padding:6px 14px;font-size:12px}
    .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
    .stat-card{background:var(--bg-card);border-radius:var(--radius);padding:14px;text-align:center;border:1px solid var(--border);transition:all .2s}
    .stat-card:hover{border-color:var(--primary);transform:translateY(-2px)}
    .stat-icon{font-size:24px;margin-bottom:6px}
    .stat-info{display:flex;flex-direction:column}
    .stat-label{font-size:11px;color:var(--text-muted);margin-bottom:2px}
    .stat-value{font-size:18px;font-weight:700}
    .stat-value small{font-size:11px;color:var(--text-muted);font-weight:400}
    .recommendations{background:linear-gradient(135deg,rgba(78,205,196,.1),rgba(78,205,196,.05));border:1px solid rgba(78,205,196,.2);border-radius:var(--radius);padding:16px;margin-bottom:20px}
    .recommendations h3{color:var(--secondary);font-size:15px;margin-bottom:8px}
    .rec-item{font-size:13px;padding:4px 0;line-height:1.5}
    .training-zones{margin-bottom:20px}
    .training-zones h3{font-size:16px;margin-bottom:10px}
    .zones-grid{display:flex;gap:10px;flex-wrap:wrap}
    .zone-card{display:flex;align-items:center;gap:8px;padding:12px 18px;background:var(--bg-card);border:1px solid var(--border);border-radius:50px;transition:all .2s}
    .zone-card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:0 4px 16px rgba(255,107,53,.15)}
    .zone-emoji{font-size:22px}
    .zone-name{font-size:14px;font-weight:600}
    .exercises-section h3{font-size:16px;margin-bottom:10px}
    .exercise-list{display:flex;flex-direction:column;gap:10px}
    .exercise-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;transition:all .2s}
    .exercise-card:hover{border-color:var(--primary);box-shadow:0 4px 24px rgba(0,0,0,.3)}
    .exercise-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
    .exercise-name{font-size:15px;font-weight:600}
    .exercise-sets{font-size:12px;color:var(--primary);background:rgba(255,107,53,.1);padding:2px 10px;border-radius:20px;font-weight:600}
    .exercise-detail{display:flex;flex-direction:column;gap:4px}
    .exercise-weight{font-size:12px;color:var(--text-muted)}
    .exercise-tip{font-size:12px;color:var(--secondary)}
    .rest-day-card{text-align:center;padding:40px 20px;background:var(--bg-card);border-radius:var(--radius);border:1px solid var(--border)}
    .rest-emoji{font-size:64px;display:block;margin-bottom:12px}
    .rest-day-card h3{font-size:22px;margin-bottom:8px}
    .rest-day-card>p{color:var(--text-muted);margin-bottom:20px}
    .rest-tips{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
    .rest-tip{background:var(--bg);padding:10px 14px;border-radius:var(--radius-sm);font-size:13px}
    .weekly-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:20px}
    .weekly-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;transition:all .2s}
    .weekly-card.today{border-color:var(--primary);background:linear-gradient(135deg,rgba(255,107,53,.1),var(--bg-card))}
    .weekly-card:hover{transform:translateY(-2px)}
    .weekly-day-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
    .weekly-day{font-size:16px;font-weight:700}
    .today-tag{font-size:10px;background:var(--gradient-1);color:#fff;padding:2px 8px;border-radius:20px;font-weight:600}
    .weekly-focus{font-size:12px;color:var(--secondary);margin-bottom:8px;font-weight:500}
    .weekly-zones{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
    .weekly-zone-tag{font-size:11px;background:var(--bg);padding:2px 8px;border-radius:20px;color:var(--text-muted)}
    .weekly-exercise-count{font-size:11px;color:var(--text-muted);margin-top:8px}
    .principles-card{background:var(--bg-card);border-radius:var(--radius);padding:20px;border:1px solid var(--border)}
    .principles-card h3{font-size:16px;margin-bottom:14px}
    .principles-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
    .principle{background:var(--bg);padding:14px;border-radius:var(--radius-sm)}
    .principle strong{display:block;font-size:14px;color:var(--primary);margin-bottom:4px}
    .principle p{font-size:12px;color:var(--text-muted);line-height:1.5}
    .tracking-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
    .charts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-bottom:20px}
    .chart-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
    .mini-chart{width:100%}
    .mini-chart-label{font-size:13px;font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
    .trend{font-size:11px;font-weight:600}
    .trend.up{color:#4ECDC4}.trend.down{color:#FF6B6B}
    .line-chart-svg{width:100%;height:auto}
    .comparison-section{margin-bottom:20px}
    .comparison-section h3{font-size:16px;margin-bottom:12px}
    .comparison-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
    .comparison-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
    .comparison-header{font-size:14px;font-weight:600;margin-bottom:12px}
    .comparison-bars{display:flex;flex-direction:column;gap:10px}
    .bar-item{display:flex;align-items:center;gap:10px}
    .bar-label{font-size:12px;color:var(--text-muted);width:36px;flex-shrink:0}
    .bar-track{flex:1;height:26px;background:var(--bg);border-radius:20px;overflow:hidden}
    .bar-fill{height:100%;border-radius:20px;display:flex;align-items:center;padding-left:10px;font-size:11px;font-weight:600;color:#fff;min-width:60px;transition:width .5s ease}
    .bar-fill.left{background:var(--gradient-3)}.bar-fill.right{background:var(--gradient-2)}
    .bar-diff{font-size:11px;color:var(--text-muted);text-align:right;padding-top:2px}
    .history-table-section{margin-bottom:20px}
    .history-table-section h3{font-size:16px;margin-bottom:10px}
    .table-wrapper{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border)}
    .history-table{width:100%;border-collapse:collapse;font-size:13px}
    .history-table th{background:var(--bg-card);color:var(--text-muted);font-weight:600;padding:12px;text-align:center;white-space:nowrap;font-size:11px}
    .history-table td{padding:10px 12px;text-align:center;border-top:1px solid var(--border);white-space:nowrap}
    .history-table tbody tr:hover{background:rgba(255,107,53,.05)}
    .library-grid{display:flex;flex-direction:column;gap:16px}
    .library-zone{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
    .library-zone-title{font-size:16px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
    .library-exercises{display:flex;flex-direction:column;gap:8px}
    .library-exercise-card{background:var(--bg);border-radius:var(--radius-sm);padding:12px 14px;transition:all .2s}
    .library-exercise-card:hover{background:var(--bg-card-hover)}
    .lib-ex-name{font-size:14px;font-weight:600;margin-bottom:4px}
    .lib-ex-meta{display:flex;gap:12px;font-size:12px;color:var(--text-muted);margin-bottom:4px}
    .lib-ex-tip{font-size:12px;color:var(--secondary)}
    .app-footer{text-align:center;padding:24px 0;color:var(--text-muted);font-size:12px;border-top:1px solid var(--border);margin-top:20px}
    .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
    .modal-content{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:480px;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
    .modal-content h3{font-size:18px;margin-bottom:20px}
    .form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    .form-field{display:flex;flex-direction:column;gap:4px}
    .form-field label{font-size:12px;color:var(--text-muted)}
    .form-field input{background:var(--bg-input);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:var(--radius-sm);font-size:14px;transition:border-color .2s;width:100%}
    .form-field input:focus{outline:none;border-color:var(--primary)}
    .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
    .hidden{display:none!important}
    .fade-in{animation:fadeIn .3s ease}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

    /* 登录页样式 */
    .login-container{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
    .login-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:40px 32px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
    .login-card .logo{text-align:center;margin-bottom:32px}
    .login-card .logo .icon{font-size:56px;display:block;margin-bottom:8px}
    .login-card .logo h1{font-size:24px;background:var(--gradient-1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .login-card .logo p{color:var(--text-muted);font-size:13px;margin-top:4px}
    .login-form{display:flex;flex-direction:column;gap:14px}
    .login-form .field label{display:block;font-size:13px;color:var(--text-muted);margin-bottom:6px;font-weight:500}
    .login-form .field input{width:100%;background:var(--bg-input);border:1px solid var(--border);color:var(--text);padding:12px 14px;border-radius:var(--radius-sm);font-size:15px;transition:border-color .2s}
    .login-form .field input:focus{outline:none;border-color:var(--primary)}
    .login-form .btn-login{width:100%;padding:12px;border:none;border-radius:var(--radius-sm);background:var(--gradient-1);color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s;margin-top:4px}
    .login-form .btn-login:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(255,107,53,.3)}
    .login-switch{text-align:center;margin-top:16px;font-size:13px;color:var(--text-muted)}
    .login-switch a{color:var(--primary);cursor:pointer;font-weight:600;text-decoration:none}
    .login-switch a:hover{text-decoration:underline}
    .login-error{background:rgba(231,76,60,.1);border:1px solid rgba(231,76,60,.3);color:var(--danger);padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;text-align:center}
    .login-success{background:rgba(78,205,196,.1);border:1px solid rgba(78,205,196,.3);color:var(--secondary);padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;text-align:center}

    /* 用户栏 */
    .user-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--bg-card);border-radius:var(--radius);margin-bottom:16px;border:1px solid var(--border)}
    .user-bar .user-info{display:flex;align-items:center;gap:10px;font-size:14px}
    .user-bar .user-avatar{width:36px;height:36px;border-radius:50%;background:var(--gradient-1);display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;font-weight:700}
    .user-bar .user-name{font-weight:600}
    .user-bar .logout-btn{padding:6px 14px;font-size:12px}

    @media(max-width:600px){
      .stats-row{grid-template-columns:repeat(2,1fr)}
      .weekly-grid{grid-template-columns:1fr}
      .charts-grid,.comparison-grid,.form-grid,.rest-tips,.principles-grid{grid-template-columns:1fr}
      .tab-btn{font-size:11px;padding:8px 6px}
      .app-header h1{font-size:22px}
      .login-card{padding:28px 20px}
    }
    ::-webkit-scrollbar{width:6px;height:6px}
    ::-webkit-scrollbar-track{background:var(--bg)}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  </style>
</head>

  <div id="root"></div>

  <script>

    var DEFAULT_BODY_DATA = {
      date: new Date().toISOString().split('T')[0],
      weight:75, leftArm:35, rightArm:35.5,
      leftLeg:55, rightLeg:55.5,
      chest_cm:100, waist:82, hip:96,
    };

    // ===== 工具函数 =====
    function el(tag, attrs, children) {
      var e = document.createElement(tag);
      if(attrs){
        for(var k in attrs){
          if(k === 'className') e.className = attrs[k];
          else if(k === 'style' && typeof attrs[k] === 'object') Object.assign(e.style, attrs[k]);
          else if(k === 'innerHTML') e.innerHTML = attrs[k];
          else if(k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
          else e.setAttribute(k, attrs[k]);
        }
      }
      if(children !== undefined && children !== null){
        if(typeof children === 'string' || typeof children === 'number') e.textContent = children;
        else if(Array.isArray(children)) children.forEach(function(c){ if(c) e.appendChild(typeof c==='string'?document.createTextNode(c):c); });
        else if(children instanceof Node) e.appendChild(children);
      }
      return e;
    }

    function generateWeeklyPlan(bodyData){
      var dayOfWeek = new Date().getDay();
      var weeklySchedule = [
        { day:'周一', zones:['chest','shoulders','arms'], focus:'推力训练日' },
        { day:'周二', zones:['back','arms'], focus:'拉力训练日' },
        { day:'周三', zones:['legs','core'], focus:'腿部训练日' },
        { day:'周四', zones:['chest','back'], focus:'上下肢混合日' },
        { day:'周五', zones:['shoulders','arms','core'], focus:'上肢+核心日' },
        { day:'周六', zones:['legs','cardio'], focus:'腿部+有氧日' },
        { day:'周日', zones:['rest'], focus:'休息恢复日' },
      ];
      var armAvg = (bodyData.leftArm + bodyData.rightArm) / 2;
      var legAvg = (bodyData.leftLeg + bodyData.rightLeg) / 2;
      var recommendations = [];
      if(armAvg < 37) recommendations.push('💡 手臂围度偏小，建议增加手臂孤立训练频次');
      if(legAvg < 56) recommendations.push('💡 腿部围度有提升空间，深蹲日可适当增加容量');
      var idx = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
      return { weeklySchedule:weeklySchedule, todaySchedule:weeklySchedule[idx], recommendations:recommendations, armAvg:armAvg, legAvg:legAvg };
    }

    function generateHistoryData(){
      var data = [];
      var baseData = Object.assign({}, DEFAULT_BODY_DATA);
      var today = new Date();
      for(var i = 90; i >= 0; i -= 7){
        var d = new Date(today);
        d.setDate(d.getDate() - i);
        var week = Math.floor((90 - i) / 7);
        data.push({
          date: d.toISOString().split('T')[0],
          weight: Math.round((baseData.weight - week * 0.3 + Math.random() * 0.5) * 10) / 10,
          leftArm: Math.round((baseData.leftArm + week * 0.08 + Math.random() * 0.1) * 10) / 10,
          rightArm: Math.round((baseData.rightArm + week * 0.08 + Math.random() * 0.1) * 10) / 10,
          leftLeg: Math.round((baseData.leftLeg + week * 0.12 + Math.random() * 0.15) * 10) / 10,
          rightLeg: Math.round((baseData.rightLeg + week * 0.12 + Math.random() * 0.15) * 10) / 10,
        });
      }
      return data;
    }

    // ===== SVG 折线图 =====
    function createLineChart(data, label, color, unit){
      unit = unit || 'cm';
      var container = el('div', { className:'mini-chart' });
      if(!data || data.length === 0) return container;

      var values = data.map(function(d){ return d.value; });
      var maxVal = Math.max.apply(null, values);
      var minVal = Math.min.apply(null, values);
      var range = maxVal - minVal || 1;
      var height = 100, width = 280;
      var pad = { top:10, bottom:20, left:10, right:10 };
      var cw = width - pad.left - pad.right;
      var ch = height - pad.top - pad.bottom;

      var points = data.map(function(d,i){
        var x = pad.left + (i / (data.length - 1)) * cw;
        var y = pad.top + ch - ((d.value - minVal) / range) * ch;
        return x + ',' + y;
      }).join(' ');

      var last = data[data.length - 1];
      var first = data[0];
      var diff = last.value - first.value;
      var trendUp = diff >= 0;
      var gradId = 'grad-' + label.replace(/\s/g,'') + '-' + Math.random().toString(36).slice(2,6);

      var labelDiv = el('div', { className:'mini-chart-label' });
      labelDiv.appendChild(el('span', null, label + ': ' + last.value + unit));
      if(data.length >= 2){
        labelDiv.appendChild(el('span', { className:'trend ' + (trendUp ? 'up' : 'down') },
          (trendUp ? ' ↑' : ' ↓') + Math.abs(Math.round(diff * 10) / 10) + unit
        ));
      }
      container.appendChild(labelDiv);

      var svgNS = 'http://www.w3.org/2000/svg';
      var svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute('viewBox', '0 0 ' + width + ' ' + height);
      svg.setAttribute('class', 'line-chart-svg');

      var defs = document.createElementNS(svgNS, 'defs');
      var grad = document.createElementNS(svgNS, 'linearGradient');
      grad.setAttribute('id', gradId);
      grad.setAttribute('x1','0'); grad.setAttribute('y1','0');
      grad.setAttribute('x2','0'); grad.setAttribute('y2','1');
      var stop1 = document.createElementNS(svgNS, 'stop');
      stop1.setAttribute('offset','0%'); stop1.setAttribute('stop-color',color); stop1.setAttribute('stop-opacity','0.3');
      var stop2 = document.createElementNS(svgNS, 'stop');
      stop2.setAttribute('offset','100%'); stop2.setAttribute('stop-color',color); stop2.setAttribute('stop-opacity','0.02');
      grad.appendChild(stop1); grad.appendChild(stop2);
      defs.appendChild(grad);
      svg.appendChild(defs);

      var poly = document.createElementNS(svgNS, 'polygon');
      poly.setAttribute('points', pad.left+','+(pad.top+ch) + ' ' + points + ' ' + (pad.left+cw)+','+(pad.top+ch));
      poly.setAttribute('fill', 'url(#' + gradId + ')');
      svg.appendChild(poly);

      var line = document.createElementNS(svgNS, 'polyline');
      line.setAttribute('points', points);
      line.setAttribute('fill','none'); line.setAttribute('stroke',color);
      line.setAttribute('stroke-width','2'); line.setAttribute('stroke-linecap','round'); line.setAttribute('stroke-linejoin','round');
      svg.appendChild(line);

      data.forEach(function(d,i){
        var cx = pad.left + (i / (data.length - 1)) * cw;
        var cy = pad.top + ch - ((d.value - minVal) / range) * ch;
        var circle = document.createElementNS(svgNS, 'circle');
        circle.setAttribute('cx', cx); circle.setAttribute('cy', cy); circle.setAttribute('r','3');
        circle.setAttribute('fill','white'); circle.setAttribute('stroke',color); circle.setAttribute('stroke-width','2');
        svg.appendChild(circle);
      });

      container.appendChild(svg);
      return container;
    }

    // ===== 登录页面 =====
    function renderLoginPage(){
      var root = document.getElementById('root');
      root.innerHTML = '';
      root.className = '';

      var isRegister = false;
      var errorMsg = '';
      var successMsg = '';

      function renderForm(){
        root.innerHTML = '';
        var container = el('div', { className:'login-container' });
        var card = el('div', { className:'login-card' });

        // Logo
        var logo = el('div', { className:'logo' }, [
          el('span', { className:'icon' }, '🏋️'),
          el('h1', null, '智能健身推荐'),
          el('p', null, '登录以保存你的训练数据')
        ]);
        card.appendChild(logo);

        // 错误/成功提示
        if(errorMsg) card.appendChild(el('div', { className:'login-error' }, errorMsg));
        if(successMsg) card.appendChild(el('div', { className:'login-success' }, successMsg));

        // 表单
        var form = el('div', { className:'login-form' });

        var usernameField = el('div', { className:'field' });
        usernameField.appendChild(el('label', null, '用户名'));
        var usernameInput = el('input', { type:'text', placeholder:'请输入用户名', autocomplete:'username' });
        usernameField.appendChild(usernameInput);
        form.appendChild(usernameField);

        var passwordField = el('div', { className:'field' });
        passwordField.appendChild(el('label', null, '密码'));
        var passwordInput = el('input', { type:'password', placeholder:'请输入密码', autocomplete: isRegister ? 'new-password' : 'current-password' });
        passwordField.appendChild(passwordInput);
        form.appendChild(passwordField);

        if(isRegister){
          var confirmField = el('div', { className:'field' });
          confirmField.appendChild(el('label', null, '确认密码'));
          var confirmInput = el('input', { type:'password', placeholder:'请再次输入密码', autocomplete:'new-password' });
          confirmField.appendChild(confirmInput);
          form.appendChild(confirmField);
        }

        var submitBtn = el('button', { className:'btn-login' }, isRegister ? '注 册' : '登 录');
        form.appendChild(submitBtn);
        card.appendChild(form);

        // 切换
        var switchDiv = el('div', { className:'login-switch' });
        if(isRegister){
          switchDiv.innerHTML = '已有账号？<a id="switchLink">去登录</a>';
        } else {
          switchDiv.innerHTML = '没有账号？<a id="switchLink">立即注册</a>';
        }
        card.appendChild(switchDiv);
        container.appendChild(card);
        root.appendChild(container);

        // 事件绑定
        document.getElementById('switchLink').addEventListener('click', function(){
          isRegister = !isRegister;
          errorMsg = '';
          successMsg = '';
          renderForm();
        });

        submitBtn.addEventListener('click', function(){
          var username = usernameInput.value.trim();
          var password = passwordInput.value.trim();
          errorMsg = '';
          successMsg = '';

          if(!username || !password){
            errorMsg = '请输入用户名和密码';
            renderForm();
            return;
          }
          if(username.length < 2){
            errorMsg = '用户名至少2个字符';
            renderForm();
            return;
          }
          if(password.length < 3){
            errorMsg = '密码至少3个字符';
            renderForm();
            return;
          }

          var users = getUsers();

          if(isRegister){
            if(users[username]){
              errorMsg = '用户名已存在，请换一个';
              renderForm();
              return;
            }
            var confirmPwd = confirmInput ? confirmInput.value.trim() : '';
            if(password !== confirmPwd){
              errorMsg = '两次密码不一致';
              renderForm();
              return;
            }
            // 注册新用户
            users[username] = {
              bodyData: Object.assign({}, DEFAULT_BODY_DATA, { date: new Date().toISOString().split('T')[0] }),
              historyData: generateHistoryData()
            };
            saveUsers(users);
            setCurrentUser(username);
            successMsg = '注册成功，正在进入...';
            renderForm();
            setTimeout(function(){ renderMainApp(); }, 800);
          } else {
            // 登录
            if(!users[username]){
              errorMsg = '用户不存在，请先注册';
              renderForm();
              return;
            }
            if(users[username].password !== undefined && users[username].password !== password){
              errorMsg = '密码错误';
              renderForm();
              return;
            }
            // 如果是老用户没有密码字段，或密码匹配，都允许登录
            // 保存密码到用户数据
            if(users[username].password === undefined){
              users[username].password = password;
              saveUsers(users);
            }
            setCurrentUser(username);
            renderMainApp();
          }
        });

        // Enter 键提交
        var allInputs = [usernameInput, passwordInput];
        if(isRegister) allInputs.push(confirmInput);
        allInputs[allInputs.length - 1].addEventListener('keydown', function(e){
          if(e.key === 'Enter') submitBtn.click();
        });

        // 自动聚焦
        setTimeout(function(){ usernameInput.focus(); }, 100);
      }

      renderForm();
    }

              wz.appendChild(el('span', { className:'weekly-zone-tag' }, zone.emoji + ' ' + zone.name));
            });
            card.appendChild(wz);
            if(day.zones[0] !== 'rest'){
              var cnt = day.zones.reduce(function(s,z){ return s + (EXERCISE_LIBRARY[z]||[]).length; }, 0);
              card.appendChild(el('div', { className:'weekly-exercise-count' }, cnt + ' 个推荐动作'));
            }
            wg.appendChild(card);
          });
          section.appendChild(wg);

          var pc = el('div', { className:'principles-card' });
          pc.appendChild(el('h3', null, '📖 训练原则'));
          var pg = el('div', { className:'principles-grid' });
          [
            { title:'渐进超负荷', desc:'每周逐步增加重量、次数或组数' },
            { title:'分化训练', desc:'推拉腿分割，每个肌群充分休息48-72小时' },
            { title:'复合动作为主', desc:'深蹲、卧推、硬拉等复合动作效率最高' },
            { title:'营养支持', desc:'训练日保证每公斤体重1.6-2.2g蛋白质摄入' },
          ].forEach(function(p){
            pg.appendChild(el('div', { className:'principle' }, [
              el('strong', null, p.title), el('p', null, p.desc)
            ]));
          });
          pc.appendChild(pg);
          section.appendChild(pc);
        }

        else if(currentTab === 'tracking'){
          var th2 = el('div', { className:'tracking-header' });
          th2.appendChild(el('h2', { className:'section-title' }, '📈 身体数据追踪'));
          var uBtn = el('button', { className:'btn btn-primary' }, '✏️ 更新数据');
          uBtn.addEventListener('click', function(){ showBodyDataForm(bodyData, onUpdateData); });
          th2.appendChild(uBtn);
          section.appendChild(th2);

          var armChartData = historyData.map(function(d){ return { date:d.date, value:Math.round(((d.leftArm+d.rightArm)/2)*10)/10 }; });
          var legChartData = historyData.map(function(d){ return { date:d.date, value:Math.round(((d.leftLeg+d.rightLeg)/2)*10)/10 }; });
          var weightChartData = historyData.map(function(d){ return { date:d.date, value:d.weight }; });

          var cg = el('div', { className:'charts-grid' });
          [ { data:armChartData, label:'平均臂围', color:'#FF6B6B' },
            { data:legChartData, label:'平均腿围', color:'#4ECDC4' },
            { data:weightChartData, label:'体重', color:'#45B7D1', unit:'kg' } ].forEach(function(c){
            var cc = el('div', { className:'chart-card' });
            cc.appendChild(createLineChart(c.data, c.label, c.color, c.unit));
            cg.appendChild(cc);
          });
          section.appendChild(cg);

          // 左右对称对比
          var cs = el('div', { className:'comparison-section' });
          cs.appendChild(el('h3', null, '📏 左右对称性对比'));
          var compGrid = el('div', { className:'comparison-grid' });

          function createComparisonCard(title, leftVal, rightVal, maxVal, leftLabel, rightLabel){
            var card = el('div', { className:'comparison-card' });
            card.appendChild(el('div', { className:'comparison-header' }, title));
            var bars = el('div', { className:'comparison-bars' });
            [{ label:leftLabel, val:leftVal, cls:'left' }, { label:rightLabel, val:rightVal, cls:'right' }].forEach(function(b){
              var bi = el('div', { className:'bar-item' });
              bi.appendChild(el('span', { className:'bar-label' }, b.label));
              var track = el('div', { className:'bar-track' });
              track.appendChild(el('div', { className:'bar-fill ' + b.cls, style:{ width:(b.val/maxVal*100)+'%' } }, b.val + ' cm'));
              bi.appendChild(track);
              bars.appendChild(bi);
            });
            bars.appendChild(el('div', { className:'bar-diff' }, '差距: ' + Math.abs(leftVal - rightVal).toFixed(1) + ' cm'));
            card.appendChild(bars);
            return card;
          }
          compGrid.appendChild(createComparisonCard('💪 臂围对比', bodyData.leftArm, bodyData.rightArm, 45, '左臂', '右臂'));
          compGrid.appendChild(createComparisonCard('🦵 腿围对比', bodyData.leftLeg, bodyData.rightLeg, 65, '左腿', '右腿'));
          cs.appendChild(compGrid);
          section.appendChild(cs);

          // 历史表
          var hts = el('div', { className:'history-table-section' });
          hts.appendChild(el('h3', null, '📋 历史记录'));
          var tw = el('div', { className:'table-wrapper' });
          var table = el('table', { className:'history-table' });
          var thead = el('thead', null, el('tr', null, [
            el('th', null, '日期'), el('th', null, '体重'), el('th', null, '左臂围'),
            el('th', null, '右臂围'), el('th', null, '左腿围'), el('th', null, '右腿围')
          ]));
          table.appendChild(thead);
          var tbody = el('tbody');
          [].concat(historyData).reverse().slice(0, 10).forEach(function(d){
            tbody.appendChild(el('tr', null, [
              el('td', null, d.date), el('td', null, d.weight + ' kg'),
              el('td', null, d.leftArm + ' cm'), el('td', null, d.rightArm + ' cm'),
              el('td', null, d.leftLeg + ' cm'), el('td', null, d.rightLeg + ' cm')
            ]));
          });
          table.appendChild(tbody);
          tw.appendChild(table);
          hts.appendChild(tw);
          section.appendChild(hts);
        }

        else if(currentTab === 'library'){
          section.appendChild(el('h2', { className:'section-title' }, '📚 训练动作库'));
          var lg = el('div', { className:'library-grid' });
          Object.keys(EXERCISE_LIBRARY).forEach(function(zid){
            var exercises = EXERCISE_LIBRARY[zid];
            var zone = TRAINING_ZONES.find(function(z){ return z.id === zid; });
            if(!zone) return;
            var lz = el('div', { className:'library-zone' });
            lz.appendChild(el('h3', { className:'library-zone-title' }, zone.emoji + ' ' + zone.name));
            var lex = el('div', { className:'library-exercises' });
            exercises.forEach(function(ex){
              lex.appendChild(el('div', { className:'library-exercise-card' }, [
                el('div', { className:'lib-ex-name' }, ex.name),
                el('div', { className:'lib-ex-meta' }, [ el('span', null, ex.sets), el('span', null, ex.weight) ]),
                el('div', { className:'lib-ex-tip' }, '💡 ' + ex.tip)
              ]));
            });
            lz.appendChild(lex);
            lg.appendChild(lz);
          });
          section.appendChild(lg);
        }
      }

      renderTabContent();

      root.appendChild(header);
      root.appendChild(userBar);
      root.appendChild(tabNav);
      root.appendChild(mainContent);
      root.appendChild(el('footer', { className:'app-footer' }, el('p', null, '🏋️ 智能健身推荐系统 · 坚持训练，遇见更好的自己！')));
    }

    // ===== 启动 =====
    function init(){
      var currentUser = getCurrentUser();
      if(currentUser){
        var users = getUsers();
        if(users[currentUser]){
          renderMainApp();
          return;
        }
      }
      renderLoginPage();
    }

    if(document.readyState === 'loading'){
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
  </script>
</body>
</html>
